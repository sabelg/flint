[workspace]
name = "flint"
version = "0.1.0"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
mojo = ">=1.2,<1.3"

[tasks]
sync = "bash tools/sync_from_deepsong.sh"
build = "bash tools/flint.sh build"
play = "bash tools/flint.sh play"
test = "bash tools/flint.sh test"
gate = "bash tools/flint.sh gate"
mcp = "bash tools/flint.sh mcp"
